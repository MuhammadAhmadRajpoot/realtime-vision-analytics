[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-vision-analytics"
version = "0.1.0"
description = "Real-time people/vehicle counting, zone occupancy and dwell-time analytics with YOLO + ByteTrack, served by FastAPI."
readme = "README.md"
license = "MIT"
authors = [{ name = "Muhammad Ahmad" }]
requires-python = ">=3.11"
# Exact, tested pins live in requirements.txt (which also selects CPU-only PyTorch).
dependencies = [
    "ultralytics>=8.3",
    "supervision>=0.26",
    "trackers>=2.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
onnx = ["onnx>=1.16", "onnxruntime>=1.18", "onnxslim>=0.1"]

[project.scripts]
rva = "rva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rva = ["web/static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "A", "C4", "PTH", "PL"]
ignore = ["PLR0913", "PLR2004", "PLC0415", "PLR0915", "PLR0912"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["model: runs the real YOLO model (downloads ~5 MB weights on first run)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint.isort]
known-first-party = ["rva", "fakes"]
